<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Courier Dispatch List</title>
<style>
  :root{
    --bg:#f4f1ec; --card:#ffffff; --ink:#1c1b19; --muted:#6f6a62; --line:#e4dfd6;
    --accent:#1f6f5c; --accent-ink:#ffffff; --warn:#b4541a; --warn-bg:#fdf0e6; --done:#e9f3ef;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#141413; --card:#1e1d1b; --ink:#f1eee8; --muted:#a39d93; --line:#33312d;
      --accent:#3fa58a; --accent-ink:#0c1512; --warn:#f0a06a; --warn-bg:#2e2218; --done:#17251f;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
  h1{font-size:19px;margin:0 0 2px}
  .stats{color:var(--muted);font-size:13px;margin-bottom:10px}
  input[type=search]{width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--line);
    border-radius:12px;background:var(--card);color:var(--ink);outline:none}
  input[type=search]:focus{border-color:var(--accent)}
  .tabs{display:flex;gap:6px;margin-top:10px}
  .tab{flex:1;padding:9px 0;border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:10px;font-size:14px;font-weight:600}
  .tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  main{position:relative;display:flex;gap:12px;overflow-x:auto;overflow-y:visible;
    scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:12px 16px 100px;scrollbar-width:none}
  main::-webkit-scrollbar{display:none}
  .card{flex:0 0 calc(100vw - 32px);max-width:600px;scroll-snap-align:center;scroll-snap-stop:always;
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;align-self:flex-start}
  @media (min-width:640px){ .card{flex-basis:600px} main{padding-left:calc(50vw - 300px);padding-right:calc(50vw - 300px)} }
  .pos{font-size:12px;color:var(--muted);font-weight:600}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:center;gap:10px;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
  nav button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);
    color:var(--ink);font-weight:700;font-size:15px}
  nav button:disabled{opacity:.35}
  #counter{flex:none;min-width:70px;text-align:center;font-weight:700}
  .card.done{background:var(--done);opacity:.75}
  .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .name{font-weight:700;font-size:17px}
  .co{color:var(--muted);font-size:14px}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .b{font-size:12px;padding:3px 8px;border-radius:20px;background:var(--bg);border:1px solid var(--line)}
  .b.q{font-weight:700}
  .b.w{background:var(--warn-bg);color:var(--warn);border-color:transparent}
  .row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .row:first-of-type{margin-top:10px}
  .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .val{font-size:15px;word-break:break-word}
  .val.big{font-size:18px;font-weight:700;letter-spacing:.03em}
  .grow{flex:1;min-width:0}
  button.cp{flex:none;min-width:74px;padding:10px 12px;border:none;border-radius:10px;
    background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px}
  button.cp:active{transform:scale(.96)}
  button.cp.ok{background:var(--ink);color:var(--bg)}
  .actions{display:flex;gap:8px;margin-top:10px}
  .actions button{flex:1;padding:12px;border-radius:10px;font-weight:700;font-size:14px;
    border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  .actions .sent.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .empty{text-align:center;color:var(--muted);padding:40px 0}
  #toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:30px;font-weight:600;font-size:14px;
    transition:.2s;pointer-events:none;z-index:10}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

  <h1>Courier Dispatch List</h1>
  <div class="stats" id="stats"></div>
  <input type="search" id="q" placeholder="Search name, company, city, pincode…" autocomplete="off">
  <div class="tabs">
    <button class="tab on" data-f="pending">Pending</button>
    <button class="tab" data-f="all">All</button>
    <button class="tab" data-f="done">Sent</button>
  </div>
</header>
<main id="list"></main>
<nav>
  <button id="prev">← Prev</button>
  <div id="counter">0 / 0</div>
  <button id="next">Next →</button>
</nav>
<div id="toast">Copied</div>

const KEY = "dispatch-sent-v1";
let sent = {};
try { sent = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) { sent = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(sent)); } catch(e) {} };

let filter = "pending", query = "";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 1200);
}

async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    let ok = false; try { ok = document.execCommand("copy"); } catch(_) {}
    document.body.removeChild(ta); return ok;
  }
}

function fullBlock(r){
  return `${r.n}\n${r.c}\n${r.a}\nPincode: ${r.pin}\nPhone: ${r.p}\nQty: ${r.q}`;
}

function render(){
  const list = $("#list");
  const qq = query.trim().toLowerCase();
  const rows = DATA.map((r,i)=>({...r,i})).filter(r=>{
    const isSent = !!sent[r.i];
    if (filter==="pending" && isSent) return false;
    if (filter==="done" && !isSent) return false;
    if (!qq) return true;
    return [r.n,r.c,r.city,r.pin,r.p,r.a].join(" ").toLowerCase().includes(qq);
  });

  const total = DATA.length, done = DATA.filter((_,i)=>sent[i]).length;
  const qty = DATA.reduce((s,r)=>s+r.q,0);
  $("#stats").textContent = `${total} entries · ${qty} boxes · ${done} sent · ${total-done} pending`;

  if (!rows.length){
    list.innerHTML = `<div class="empty" style="flex:0 0 100%">${filter==="pending" && !qq ? "🎉 All sent!" : "Nothing here."}</div>`;
    updateNav(); return;
  }

  list.innerHTML = rows.map((r,k) => `
    <div class="card ${sent[r.i]?"done":""}" data-row="${r.i}">
      <div class="top">
        <div class="grow">
          <div class="name">${esc(r.n)}</div>
          <div class="co">${esc(r.c)} · ${esc(r.city)}</div>
        </div>
        <div class="pos">#${r.i+1}</div>
      </div>
      <div class="badges">
        <span class="b q">Qty ${r.q}</span>
        <span class="b">${esc(r.m)}</span>
        ${r.w ? `<span class="b w">⚠ ${esc(r.w)}</span>` : ""}
      </div>
      <div class="row"><div class="grow"><div class="lbl">Name</div><div class="val">${esc(r.n)}</div></div>
        <button class="cp" data-i="${r.i}" data-k="n">Copy</button></div>
      <div class="row"><div class="grow"><div class="lbl">Phone</div><div class="val big">${esc(r.p)}</div></div>
        <button class="cp" data-i="${r.i}" data-k="p">Copy</button></div>
      <div class="row"><div class="grow"><div class="lbl">Address</div><div class="val">${esc(r.a)}</div></div>
        <button class="cp" data-i="${r.i}" data-k="a">Copy</button></div>
      <div class="row"><div class="grow"><div class="lbl">Pincode</div><div class="val big">${esc(r.pin)}</div></div>
        <button class="cp" data-i="${r.i}" data-k="pin">Copy</button></div>
      <div class="actions">
        <button class="all" data-i="${r.i}">Copy all</button>
        <button class="sent ${sent[r.i]?"on":""}" data-i="${r.i}">${sent[r.i]?"✓ Sent":"Mark sent"}</button>
      </div>
    </div>`).join("");
  updateNav();
}

const list = () => $("#list");
const cards = () => [...document.querySelectorAll("#list .card")];
function curIndex(){
  const cs = cards(); if (!cs.length) return 0;
  const m = list(), mid = m.scrollLeft + m.clientWidth/2;
  let best = 0, bd = Infinity;
  cs.forEach((c,k)=>{ const d = Math.abs(c.offsetLeft + c.offsetWidth/2 - mid); if (d < bd){ bd = d; best = k; } });
  return best;
}
function goTo(k, smooth=true){
  const cs = cards(); if (!cs.length) return;
  k = Math.max(0, Math.min(cs.length-1, k));
  const c = cs[k], m = list();
  m.scrollTo({ left: c.offsetLeft - (m.clientWidth - c.offsetWidth)/2, behavior: smooth ? "smooth" : "auto" });
  window.scrollTo({ top: 0, behavior: smooth ? "smooth" : "auto" });
  setTimeout(updateNav, smooth ? 350 : 0);
}
function updateNav(){
  const n = cards().length, k = n ? curIndex() : -1;
  $("#counter").textContent = n ? `${k+1} / ${n}` : "0 / 0";
  $("#prev").disabled = k <= 0;
  $("#next").disabled = k >= n-1;
}

document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.classList.contains("tab")){
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("on"));
    b.classList.add("on"); filter = b.dataset.f; render(); goTo(0, false); return;
  }
  if (b.id === "prev"){ goTo(curIndex()-1); return; }
  if (b.id === "next"){ goTo(curIndex()+1); return; }
  const r = DATA[b.dataset.i]; if (!r) return;
  if (b.classList.contains("cp")){
    if (await copyText(r[b.dataset.k])){
      b.textContent = "✓"; b.classList.add("ok"); toast("Copied");
      setTimeout(()=>{ b.textContent="Copy"; b.classList.remove("ok"); }, 1200);
    } else toast("Copy failed — long-press to copy");
  } else if (b.classList.contains("all")){
    toast(await copyText(fullBlock(r)) ? "All details copied" : "Copy failed");
  } else if (b.classList.contains("sent")){
    const i = b.dataset.i, k = curIndex();
    if (sent[i]){                      // undo
      delete sent[i]; save(); render(); goTo(k, false); toast("Marked pending");
      return;
    }
    sent[i] = 1; save();
    if (filter === "pending"){         // card leaves the list → next one slides in
      render(); goTo(Math.min(k, cards().length-1), false);
      const c = cards()[Math.min(k, cards().length-1)];
      if (c){ c.animate([{opacity:0, transform:"translateX(30px)"},{opacity:1, transform:"none"}], {duration:220}); }
    } else {                           // keep card, move to next
      render(); goTo(k, false); setTimeout(()=>goTo(k+1), 60);
    }
    toast("✓ Sent — next");
  }
});

let st;
list().addEventListener("scroll", () => { clearTimeout(st); st = setTimeout(updateNav, 80); }, {passive:true});
window.addEventListener("resize", () => goTo(curIndex(), false));
$("#q").addEventListener("input", e => { query = e.target.value; render(); goTo(0, false); });
render();
</script>

</html>
